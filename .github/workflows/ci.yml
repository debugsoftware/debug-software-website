name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-commits:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Validate bundled images
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            images/about-company_88e9dbd7.webp
            images/about-company_d2be6fbe.png
            images/ai-solutions_274f3406.png
            images/ai-solutions_b584aee5.webp
            images/automation_147f6880.png
            images/automation_63803d5b.webp
            images/custom-solutions_012a6597.webp
            images/custom-solutions_09fa5ce3.png
            images/debug-icon_ed58b1b6.webp
            images/hero-bg_c7515ff2.png
            images/hero-bg_e6c8eda5.webp
            images/logo-debug_6f1e67d3.png
            images/logo-debug_912ef8b6.png
          )

          for asset in "${assets[@]}"; do
            test -s "dist/public/${asset}"
          done

          if grep --recursive --fixed-strings --include='*.html' --include='*.js' \
            '/manus-storage/' dist/public; then
            printf 'O build ainda contém referência ao armazenamento temporário.\n' >&2
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test -- --run --passWithNoTests

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag debug-software-website:ci .

      - name: Serve the Vite build from Nginx
        shell: bash
        run: |
          set -euo pipefail

          container_name="debug-software-website-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --rm --name "${container_name}" --publish 127.0.0.1::80 \
            debug-software-website:ci >/dev/null
          port=$(docker port "${container_name}" 80/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')
          test -n "${port}"

          frontend_ready=false
          for attempt in $(seq 1 30); do
            if html=$(curl --fail --silent --show-error "http://127.0.0.1:${port}/"); then
              if printf '%s' "${html}" | \
                grep -Fq '<title>Debug Software - Soluções em IA e Automações</title>' && \
                ! printf '%s' "${html}" | grep -Fq 'Welcome to nginx!'; then
                frontend_ready=true
                break
              fi
            fi
            sleep 2
          done

          if test "${frontend_ready}" != true; then
            printf 'O container não serviu o frontend esperado.\n' >&2
            exit 1
          fi

          assets=(
            images/about-company_88e9dbd7.webp
            images/about-company_d2be6fbe.png
            images/ai-solutions_274f3406.png
            images/ai-solutions_b584aee5.webp
            images/automation_147f6880.png
            images/automation_63803d5b.webp
            images/custom-solutions_012a6597.webp
            images/custom-solutions_09fa5ce3.png
            images/debug-icon_ed58b1b6.webp
            images/hero-bg_c7515ff2.png
            images/hero-bg_e6c8eda5.webp
            images/logo-debug_6f1e67d3.png
            images/logo-debug_912ef8b6.png
          )

          for asset in "${assets[@]}"; do
            headers=$(curl --fail --silent --show-error --head \
              "http://127.0.0.1:${port}/${asset}")
            printf '%s\n' "${headers}" | grep --ignore-case --quiet '^Content-Type: image/'
            printf '%s\n' "${headers}" | grep --ignore-case --quiet \
              '^Cache-Control: public, max-age=31536000, immutable'
          done
